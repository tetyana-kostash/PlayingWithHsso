<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Authenticating...</title>
  <!-- Load the oidc-client-ts library from a CDN -->
  <script src="/PlayingWithHsso/oidc-client-ts.min.js"></script>
</head>
<body>
  <p>Verifying your credentials, please wait...</p>
  <script>
    const userManager = new Oidc.UserManager({
  authority: "https://helixops.ai",
  client_id: "a9eb365f-b2ae-415e-b798-9aa9f34bc603",
  redirect_uri: window.location.origin + window.location.pathname,
  response_type: "code",
  scope: "openid profile",

        metadata: {
    issuer: "https://helixops.ai",
    authorization_endpoint: "https://helixops.ai/authorize",
    token_endpoint: "https://helixops.ai/token",
    userinfo_endpoint: "https://helixops.ai/userinfo",
    jwks_uri: "https://helixops.ai/jwks"
  }
});

    // Process the sign-in response from BMC Helix SSO
    userManager.signinRedirectCallback().then(() => {
      // Clear URL parameters and send user back to the main homepage
      window.location.href = "index.html"; 
    }).catch((error) => {
      console.error("SSO Authentication Error:", error);
      document.body.innerHTML = "<h3>Authentication failed. Please contact your administrator.</h3>";
    });
  </script>
</body>
</html>

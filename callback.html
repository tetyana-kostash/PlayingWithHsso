<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SSO Authentication...</title>
</head>
<body>
  <p>Processing your login credentials, please wait...</p>

  <script>
    console.log("Callback reached. Parsing URL authentication hash parameters...");

    // Extract authentication parameters returned by the BMC Helix SSO / AuthProxy server
    const hash = window.location.hash.substring(1);
    const params = new URLSearchParams(hash);
    const accessToken = params.get("access_token");

    if (accessToken) {
      // Store the secure token into the browser session storage layout
      sessionStorage.setItem("rsso_access_token", accessToken);
      console.log("Access token securely saved. Redirecting back to home page...");
      
      // Send the user back to the main repository subdirectory folder target
      window.location.href = "/PlayingWithHsso/index.html";
    } else {
      console.error("Critical Error: Failed to locate the access token in the server routing response.");
      document.body.innerHTML = "<h3>Authentication failed. Please check the browser console logs or ensure your corporate VPN environment is active.</h3>";
    }
  </script>
</body>
</html>
